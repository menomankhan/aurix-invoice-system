<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurix — Sign In</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          aurixnavy: "#04153B",
          aurixblue: "#0745E0",
        },
        fontFamily: {
          sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="min-h-screen font-sans text-white flex items-center justify-center px-6">

  <div class="w-full max-w-[380px]">
    <div class="flex flex-col items-center mb-10">
      <div class="w-14 h-14 rounded-2xl overflow-hidden mb-4 ring-1 ring-white/10 shadow-lg shadow-aurixblue/20">
        <img src="assets/logo-mark.png" alt="Aurix" class="aurix-logo w-full h-full" />
      </div>
      <h1 class="font-wordmark text-3xl font-bold tracking-tight">Aurix</h1>
      <p class="text-white/40 text-sm mt-1">Invoice Submission System</p>
    </div>

    <form id="loginForm" class="aurix-card rounded-2xl p-7 space-y-5">
      <div class="space-y-1.5">
        <label for="username" class="text-[11px] font-bold uppercase tracking-widest text-white/40 ml-0.5">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required
          class="aurix-input w-full rounded-xl px-4 py-3 text-sm" placeholder="e.g. asad" />
      </div>

      <div class="space-y-1.5">
        <label for="password" class="text-[11px] font-bold uppercase tracking-widest text-white/40 ml-0.5">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="aurix-input w-full rounded-xl px-4 py-3 text-sm" placeholder="••••••••" />
      </div>

      <p id="loginError" class="hidden text-red-400 text-xs font-medium bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2"></p>

      <button id="loginBtn" type="submit" class="aurix-btn-primary w-full rounded-xl py-3 text-sm font-bold flex items-center justify-center gap-2">
        <span id="loginBtnText">Sign In</span>
        <svg id="loginSpinner" class="hidden animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </button>
    </form>

    <p class="text-center text-white/25 text-xs mt-8">Aurix Productions · Internal use only</p>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
